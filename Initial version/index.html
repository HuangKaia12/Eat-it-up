<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eat It Up · Three Little Bites</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">A little snack, a little joy</p><h1>Eat It Up<span aria-hidden="true">.</span></h1><p class="intro">Click Eat. Finish in three bites.</p></header>
    <section class="card" aria-label="Eat the food">
      <div class="chooser"><label for="food-select">What would you like today?</label><select id="food-select"></select></div>
      <h2 id="food-name">Chocolate Chip Cookie</h2>
      <div class="stage">
        <svg id="food-svg" viewBox="0 0 100 100" role="img" aria-labelledby="food-title">
          <title id="food-title">A whole chocolate chip cookie</title>
          <defs><mask id="bite-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" style="mask-type:luminance">
            <rect width="100" height="100" fill="white"/>
            <g id="bite-one" fill="black" visibility="hidden"><circle cx="82" cy="18" r="13"/><circle cx="74" cy="23" r="10"/><circle cx="83" cy="32" r="11"/></g>
            <g id="bite-two" fill="black" visibility="hidden"><circle cx="17" cy="82" r="14"/><circle cx="18" cy="69" r="11"/><circle cx="29" cy="79" r="11"/></g>
          </mask></defs>
          <image id="food-image" x="0" y="0" width="100" height="100" mask="url(#bite-mask)"/>
        </svg>
        <p id="stage-note" hidden>All gone!</p>
      </div>
      <p id="progress" role="status" aria-live="polite" aria-atomic="true">Loading food…</p>
      <div class="actions"><button id="eat" type="button" disabled>Eat <span aria-hidden="true">↗</span></button><button id="reset" type="button">Reset</button></div>
    </section>
    <footer>Take your time, or enjoy one bite after another.</footer>
  </main>
</body>
</html>
